<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | SchoolSync</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .offline-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .offline-icon-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #EFF6FF;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            color: #2563EB;
        }
        .offline-icon-wrapper svg {
            width: 40px;
            height: 40px;
        }
        .offline-brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #2563EB;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .offline-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .offline-desc {
            font-size: 15px;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            background: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
        }
        .btn-retry:hover {
            background: #1D4ED8;
        }
        .btn-retry:active {
            transform: scale(0.98);
        }
        .connection-status {
            margin-top: 20px;
            font-size: 13px;
            color: #64748B;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #DC2626;
            display: inline-block;
        }
        .status-dot.online {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-brand">
            <img src="/icons/icon-192.png" alt="SchoolSync Logo" style="width: 28px; height: 28px; border-radius: 6px;" onerror="this.style.display='none'">SchoolSync
        </div>
        <div class="offline-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-desc">SchoolSync requires an active internet connection to securely access student data, attendance, fees, and live portal features.</p>
        <button id="retryBtn" class="btn-retry" onclick="checkConnectionAndReload()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>Retry Connection
        </button>
        <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">No Internet Connection</span>
        </div>
    </div>
    <script>
        function updateStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (navigator.onLine) {
                dot.classList.add('online');
                text.textContent = 'Connection Restored — Reconnecting...';
                setTimeout(() => {
                    window.location.reload();
                }, 1000);
            } else {
                dot.classList.remove('online');
                text.textContent = 'No Internet Connection';
            };
        };

        function checkConnectionAndReload() {
            const btn = document.getElementById('retryBtn');
            btn.innerHTML = 'Checking...';
            btn.disabled = true;
            if (navigator.onLine) {
                window.location.reload();
            } else {
                setTimeout(() => {
                    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Retry Connection`;
                    btn.disabled = false;
                    updateStatus();
                }, 600);
            };
        };

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
